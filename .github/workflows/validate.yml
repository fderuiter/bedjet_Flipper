name: Manual validation

on:
  workflow_dispatch:
    inputs:
      build_fap:
        description: Also build the FAP against the pinned experimental firmware
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Portable protocol tests with sanitizers
        run: python3 scripts/check.py --sanitizers
      - name: Verify initial artifact provenance
        run: python3 scripts/verify_artifact.py
      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install --yes clang-format-18
      - name: Check C formatting
        run: python3 scripts/check.py --format --clang-format clang-format-18

  fap:
    if: inputs.build_fap
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch pinned firmware
        run: |
          python3 - <<'PY'
          import json, subprocess
          pin = json.load(open('firmware.lock.json'))
          subprocess.run(['git', 'clone', '--no-checkout', pin['repository'], '../flipper-firmware'], check=True)
          subprocess.run(['git', '-C', '../flipper-firmware', 'checkout', '--detach', pin['commit']], check=True)
          PY
      - name: Compile application (no flashing)
        run: python3 build.py ../flipper-firmware
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bedjet-experimental-fap-${{ github.sha }}
          path: |
            dist/bedjet_remote.fap
            dist/SHA256SUMS
            firmware.lock.json
          if-no-files-found: error
          retention-days: 14

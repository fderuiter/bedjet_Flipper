name: CI

# Host checks and a FAP build against the exact pinned firmware. Nothing here
# flashes a device, installs firmware or publishes a release. Uploaded FAPs and
# the opt-in update package are unvalidated build outputs, not hardware-tested
# releases.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      firmware_package:
        description: Also build the matching Full BLE update package and upload it as a run artifact for owner installation (never installed by CI)
        type: boolean
        default: false
      reproducibility:
        description: Build the FAP in two independent clean jobs and compare SHA-256
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FBT_GIT_SUBMODULE_SHALLOW: "1"

jobs:
  host:
    name: Host checks (${{ matrix.cc }})
    # Same-repository branches are already covered by their push run; pull
    # requests are checked here only when they come from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      - name: Ensure the sanitizer runtime links
        run: |
          if ! echo 'int main(void){return 0;}' | "$CC" -x c -fsanitize=address,undefined -o /dev/null -; then
            sudo apt-get update
            sudo apt-get install --yes libclang-rt-18-dev
          fi

      - name: Repository metadata, scripts and documentation links
        run: python3 scripts/check.py --static

      - name: Protocol and lifecycle tests with sanitizers
        run: python3 scripts/check.py --sanitizers

      - name: Short-enum ABI tests with sanitizers
        run: python3 scripts/check.py --sanitizers --short-enums

      - name: Verify retained prototype artifact
        run: python3 scripts/verify_artifact.py

      - name: C formatting with clang-format 18
        if: matrix.cc == 'clang'
        run: |
          if ! command -v clang-format-18 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes clang-format-18
          fi
          python3 scripts/check.py --format --clang-format clang-format-18

  fap:
    name: FAP against pinned firmware
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read firmware pin
        id: pin
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import json

          pin = json.load(open("firmware.lock.json", encoding="utf-8"))
          print(f"repo={pin['repository']}")
          print(f"commit={pin['commit']}")
          PY

      - name: Fetch the pinned firmware and apply FredJet's patches
        run: python3 scripts/firmware_checkout.py ../flipper-firmware

      - name: Resolve toolchain version from the pinned firmware
        id: toolchain
        run: |
          version="$(grep -oE 'FBT_TOOLCHAIN_VERSION:-"[0-9]+"' ../flipper-firmware/scripts/toolchain/fbtenv.sh | grep -oE '[0-9]+' | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore ARM toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fbt/toolchain/x86_64-linux
          key: fbt-toolchain-x86_64-linux-${{ steps.toolchain.outputs.version }}

      - name: Compile and import-check the application (no flashing)
        env:
          FBT_TOOLCHAIN_PATH: ${{ runner.temp }}/fbt
          FIRMWARE_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.firmware_package }}
        run: |
          extra=()
          if [ "$FIRMWARE_PACKAGE" = "true" ]; then
            extra=(--firmware-package)
          fi
          python3 build.py ../flipper-firmware "${extra[@]}"
          cat dist/provenance.json

      - name: Upload FAP, checksum and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fredjet-fap-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/fredjet.fap
            dist/SHA256SUMS
            dist/provenance.json
            firmware.lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect Full BLE update package (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.firmware_package
        run: |
          package=../flipper-firmware/dist/f7-C/f7-update-local
          # update.py renames the stack to radio.bin; compare it byte for byte.
          grep -q '^Radio: radio.bin$' "$package/update.fuf"
          cmp "$package/radio.bin" ../flipper-firmware/lib/stm32wb_copro/firmware/stm32wb5x_BLE_Stack_full_fw.bin
          grep -q '^Radio address: 00 E0 0C 08$' "$package/update.fuf"
          mkdir -p dist/update
          cp -R "$package" dist/update/
          (cd dist/update && find . -type f -exec sha256sum {} + | sort -k2 > ../UPDATE_SHA256SUMS)
          cat dist/update/f7-update-local/update.fuf

      - name: Upload Full BLE update package
        if: github.event_name == 'workflow_dispatch' && inputs.firmware_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f7-update-full-ble-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/update/
            dist/UPDATE_SHA256SUMS
            dist/provenance.json
            firmware.lock.json
          if-no-files-found: error
          retention-days: 14

  repro-build:
    name: Clean build ${{ matrix.leg }}
    if: github.event_name == 'workflow_dispatch' && inputs.reproducibility
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: [a, b]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned firmware and apply FredJet's patches
        run: python3 scripts/firmware_checkout.py ../flipper-firmware

      - name: Compile with a fresh toolchain download (no cache)
        env:
          FBT_TOOLCHAIN_PATH: ${{ runner.temp }}/fbt
        run: python3 build.py ../flipper-firmware

      - name: Upload this leg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-fap-${{ matrix.leg }}-attempt-${{ github.run_attempt }}
          path: dist/fredjet.fap
          if-no-files-found: error
          retention-days: 3

  repro-compare:
    name: Compare clean builds
    needs: repro-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download both legs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-fap-*-attempt-${{ github.run_attempt }}
          path: repro

      - name: Compare SHA-256
        run: |
          test "$(find repro -name fredjet.fap | wc -l)" -eq 2
          find repro -name fredjet.fap -exec sha256sum {} + | tee repro-sha256.txt
          if [ "$(cut -d' ' -f1 repro-sha256.txt | sort -u | wc -l)" -eq 1 ]; then
            echo "Two clean builds at the same workspace path produced identical SHA-256." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Clean builds differ; bit-for-bit reproducibility is not established." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

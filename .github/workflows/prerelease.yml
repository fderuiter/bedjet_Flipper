name: Prerelease (manual, draft only)

# Builds a prerelease FAP and creates a DRAFT GitHub prerelease for the owner
# to review. Run it only by hand, from main, after a hardware run has been
# recorded in releases/<version>/acceptance.json (see docs/releases.md). The
# gate refuses unless every checklist step passed and the built FAP has the
# exact SHA-256 that was hardware-tested. Nothing here flashes a device,
# pushes a tag or publishes: GitHub creates the tag only when the owner
# publishes the draft.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version, e.g. 0.1.0-rc.1 (needs releases/<version>/acceptance.json on main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: false

env:
  FBT_GIT_SUBMODULE_SHALLOW: "1"

jobs:
  build:
    name: Gate, check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Prereleases are built from main only; got $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the gate can check the tested commit is an ancestor.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      - name: Gate on the committed hardware record
        id: gate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release_gate.py check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure the sanitizer runtime links
        run: |
          if ! echo 'int main(void){return 0;}' | cc -x c -fsanitize=address,undefined -o /dev/null -; then
            sudo apt-get update
            sudo apt-get install --yes libclang-rt-18-dev
          fi

      - name: Host checks
        run: |
          python3 scripts/check.py --static
          python3 scripts/check.py --sanitizers
          python3 scripts/check.py --sanitizers --short-enums
          python3 scripts/verify_artifact.py

      - name: Fetch the exact pinned firmware commit
        run: |
          repo="$(python3 -I -c 'import json; print(json.load(open("firmware.lock.json"))["repository"])')"
          commit="$(python3 -I -c 'import json; print(json.load(open("firmware.lock.json"))["commit"])')"
          git init --quiet ../flipper-firmware
          git -C ../flipper-firmware fetch --quiet --depth 1 "$repo" "$commit"
          git -C ../flipper-firmware -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
          test "$(git -C ../flipper-firmware rev-parse HEAD)" = "$commit"

      - name: Compile with a fresh toolchain download (no cache, no flashing)
        env:
          FBT_TOOLCHAIN_PATH: ${{ runner.temp }}/fbt
        run: |
          python3 build.py ../flipper-firmware
          cat dist/provenance.json

      - name: Require the hardware-tested bytes and write release notes
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          python3 scripts/release_gate.py check "$VERSION" --fap dist/fredjet.fap
          python3 scripts/release_gate.py notes "$VERSION" --fap dist/fredjet.fap \
            --provenance dist/provenance.json > dist/RELEASE_NOTES.md
          cp "releases/$VERSION/acceptance.json" dist/acceptance.json
          cp firmware.lock.json dist/firmware.lock.json
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prerelease-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/fredjet.fap
            dist/SHA256SUMS
            dist/provenance.json
            dist/acceptance.json
            dist/firmware.lock.json
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prerelease-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: release

      - name: Create the draft (the owner reviews and publishes)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release named $tag already exists; choose a new version." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; choose a new version." >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --target "$GITHUB_SHA" --title "FredJet $VERSION (prerelease)" \
            --notes-file release/RELEASE_NOTES.md \
            release/fredjet.fap release/SHA256SUMS release/provenance.json \
            release/acceptance.json release/firmware.lock.json
          echo "Draft prerelease $tag created for $GITHUB_SHA. It is not published." >> "$GITHUB_STEP_SUMMARY"

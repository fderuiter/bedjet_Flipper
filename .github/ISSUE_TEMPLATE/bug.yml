name: Bug report
description: Report a reproducible build, protocol or device-control problem.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: revision
    attributes:
      label: App revision
      description: Git commit or prototype artifact SHA256.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and test type
      description: State host-only or real hardware. Include Flipper firmware commit, Light/Full stack and version, BedJet model/firmware if known, and build OS.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include starting mode, phone-app connection state, exact inputs, and observed physical-remote values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Small logs, command/status bytes or screenshots. Remove credentials, pairing keys, Wi-Fi data and unnecessary device identifiers.
